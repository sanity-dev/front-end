<div class="flex h-[calc(100vh-150px)] max-h-[85vh] bg-gray-50/50 rounded-2xl overflow-hidden shadow-sm relative font-sans">
  
  <!-- Sidebar Overlay (Mobile) -->
  <div *ngIf="isSidebarOpen" 
       class="fixed inset-0 bg-black/50 z-20 md:hidden transition-opacity"
       (click)="toggleSidebar()"></div>

  <!-- Sidebar Historial de Chats -->
  <aside 
    class="bg-white border-r border-gray-100 w-72 flex-shrink-0 flex flex-col h-full transform transition-transform duration-300 ease-in-out absolute md:relative z-30 shadow-xl md:shadow-none"
    [ngClass]="{'translate-x-0': isSidebarOpen, '-translate-x-full md:translate-x-0': !isSidebarOpen}">
    
    <!-- Sidebar Header -->
    <div class="p-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white">
      <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5 text-indigo-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
        </svg>
        Mis Diarios
      </h2>
      <button (click)="crearNuevoDiario()" class="p-2 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition-colors tooltip-wrapper" aria-label="Nuevo Diario">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
      <button (click)="toggleSidebar()" class="md:hidden p-2 text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Sidebar Scrollable List -->
    <div class="flex-1 overflow-y-auto p-3 space-y-1">
      <div *ngIf="diarios.length === 0" class="text-center text-sm text-gray-400 mt-6 px-4">
        No tienes entradas aún. Crea tu primer diario.
      </div>
      
      <button 
        *ngFor="let diario of diarios" 
        (click)="seleccionarDiario(diario.id)"
        class="w-full text-left p-3 rounded-xl flex items-start gap-3 transition-all duration-200 group relative"
        [ngClass]="{'bg-indigo-50 border border-indigo-100': activeDiarioId === diario.id, 'hover:bg-gray-50 border border-transparent': activeDiarioId !== diario.id}">
        
        <div class="mt-1 flex-shrink-0" [ngClass]="{'text-indigo-600': activeDiarioId === diario.id, 'text-gray-400': activeDiarioId !== diario.id}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate text-gray-800" [ngClass]="{'text-indigo-900 font-semibold': activeDiarioId === diario.id}">{{ diario.titulo || 'Diario' }}</p>
          <p class="text-[0.65rem] md:text-xs text-gray-400 mt-1 uppercase tracking-wider">{{ diario.fechaCreacion | date:'mediumDate' }}</p>
        </div>
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col h-full bg-white relative">
    
    <!-- Chat Header (Visible especially on mobile or for title) -->
    <header class="h-14 flex items-center px-4 border-b border-gray-100 bg-white/80 backdrop-blur-md sticky top-0 z-10">
      <button (click)="toggleSidebar()" class="md:hidden mr-3 p-2 -ml-2 text-gray-500 hover:bg-gray-100 rounded-lg transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
        </svg>
      </button>
      <div class="flex flex-col">
        <h1 class="text-base font-semibold text-gray-800">Cápsula del Tiempo</h1>
        <span class="text-xs text-green-500 font-medium flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Memoria Activa
        </span>
      </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-20 scroll-smooth chat-bg" #scrollMe>
      
      <div *ngIf="!activeDiarioId" class="h-full flex flex-col items-center justify-center text-center opacity-70">
        <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mb-4 border border-indigo-100 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-10 text-indigo-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </div>
        <h3 class="text-xl font-bold text-gray-800">Tu Espacio Seguro</h3>
        <p class="text-gray-500 mt-2 max-w-sm px-4">Selecciona un diario del panel izquierdo o crea uno nuevo para comenzar a expresarte libremente.</p>
      </div>

      <div *ngIf="isLoading && activeDiarioId" class="flex justify-center my-6">
        <div class="animate-pulse flex items-center space-x-2">
            <div class="w-3 h-3 bg-indigo-400 rounded-full"></div>
            <div class="w-3 h-3 bg-indigo-400 rounded-full" style="animation-delay: 0.2s"></div>
            <div class="w-3 h-3 bg-indigo-400 rounded-full" style="animation-delay: 0.4s"></div>
        </div>
      </div>

      <!-- Messages Iteration -->
      <div class="space-y-6 max-w-3xl mx-auto flex flex-col justify-end min-h-full">
        <div *ngFor="let m of mensajes" class="flex w-full justify-end animate-fade-in-up">
          <div class="flex flex-col items-end max-w-[85%] md:max-w-md lg:max-w-lg">
            
            <!-- Moment / Image Bubble -->
            <div *ngIf="m.tipo === 'IMAGEN'" class="bg-gray-100 p-1.5 rounded-2xl rounded-br-sm shadow-sm overflow-hidden mb-1 border border-gray-200/60 group relative cursor-pointer">
              <img [src]="m.contenido" alt="Momento del diario" class="w-full h-auto rounded-xl object-cover max-h-64 transition-transform duration-300 group-hover:scale-[1.02]" />
               <div class="absolute bottom-2 right-2 bg-black/40 backdrop-blur-sm text-white text-[0.65rem] px-2 py-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                Momento
              </div>
            </div>

            <!-- Text Bubble -->
            <div *ngIf="m.tipo === 'TEXTO'" class="bg-gradient-to-br from-indigo-500 to-indigo-600 text-white p-3.5 md:p-4 rounded-3xl rounded-br-sm shadow-md text-[0.95rem] leading-relaxed relative bubble-highlight">
              <p class="whitespace-pre-wrap font-medium tracking-wide">{{ m.contenido }}</p>
            </div>
            
            <span class="text-[0.65rem] text-gray-400 mt-1.5 mr-1 tracking-wider uppercase drop-shadow-sm font-medium">{{ m.fechaEnvio | date:'shortTime' }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Input Area (Fixed Bottom) -->
    <div *ngIf="activeDiarioId" class="absolute bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-gray-100 p-3 md:p-4">
      <div class="max-w-3xl mx-auto relative flex items-end gap-2">
        
        <!-- Add Image Button -->
        <input type="file" id="cameraInput" accept="image/*" class="hidden" (change)="onImageSelected($event)" />
        <button (click)="triggerImageUpload()" class="p-3 text-gray-400 hover:text-indigo-500 hover:bg-indigo-50 rounded-xl transition-all duration-200 shrink-0 bg-gray-50 mb-0.5 border border-transparent hover:border-indigo-100" title="Añadir momento">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
          </svg>
        </button>

        <!-- Textarea -->
        <div class="flex-1 bg-gray-50 border border-gray-200 rounded-3xl relative flex items-center overflow-hidden focus-within:ring-2 focus-within:ring-indigo-100 focus-within:border-indigo-300 transition-all shadow-sm">
          <textarea 
            [(ngModel)]="nuevoMensaje"
            (keydown.enter)="$event.preventDefault(); enviarMensaje()"
            rows="1"
            class="w-full bg-transparent border-none py-3.5 pl-5 pr-12 focus:ring-0 resize-none text-[0.95rem] text-gray-700 placeholder-gray-400 font-medium max-h-32"
            placeholder="¿Qué tienes en mente hoy?..."
            style="min-height: 52px;"
            oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'">
          </textarea>

          <!-- Send Button (Inside Textarea overlay) -->
          <button 
            (click)="enviarMensaje()"
            [disabled]="!nuevoMensaje.trim()"
            class="absolute right-2 bottom-1.5 p-2 rounded-full transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
            [ngClass]="nuevoMensaje.trim() ? 'bg-indigo-600 text-white shadow-md hover:bg-indigo-700 hover:scale-105' : 'bg-gray-200 text-gray-400'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4 -rotate-45 ml-0.5 mb-0.5">
              <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
