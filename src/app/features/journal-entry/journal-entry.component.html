<div class="min-h-screen bg-gradient-to-b from-[#94cbf8] to-[#2d82b5] flex flex-col font-sans text-[#1e293b]">
    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-4 bg-[#94cbf8]">
        <button class="p-2 rounded-full hover:bg-white/20 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </button>
        <h1 class="text-lg font-semibold">Sanity</h1>
        <div class="w-10"></div> <!-- Spacer for centering -->
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-6 pb-24 overflow-y-auto">
        <!-- Text Area Card -->
        <div class="bg-[#f1f5f9] rounded-xl p-4 shadow-sm mb-6 min-h-[160px]">
            <textarea
                class="w-full h-full bg-transparent border-none resize-none focus:ring-0 text-sm leading-relaxed placeholder-gray-500"
                placeholder="Hoy me sentí más tranquilo después de meditar.">Hoy me sentí más tranquilo después de meditar.</textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-6 mb-8">
            <div class="flex flex-col items-center gap-2">
                <button
                    class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm hover:bg-gray-50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6 text-gray-700">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                </button>
                <span class="text-xs font-medium text-gray-800">Añadir foto</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <button
                    class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm hover:bg-gray-50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6 text-gray-700">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
                    </svg>
                </button>
                <span class="text-xs font-medium text-gray-800">Grabar</span>
            </div>
        </div>

        <!-- Emotions -->
        <div class="mb-8">
            <h2 class="text-base font-bold mb-3 text-gray-900">Emociones Detectadas</h2>
            <div class="flex gap-3 flex-wrap">
                <span *ngFor="let emotion of emotions"
                    class="px-4 py-2 bg-[#f1f5f9] rounded-lg text-sm font-medium text-gray-800 shadow-sm">
                    {{ emotion }}
                </span>
            </div>
        </div>

        <!-- History -->
        <div>
            <h2 class="text-base font-bold mb-4 text-gray-900">Historial de Entradas</h2>
            <div class="flex flex-col gap-4">
                <div *ngFor="let item of history" class="flex gap-4 items-center">
                    <div class="w-12 h-12 bg-[#f1f5f9] rounded-xl flex items-center justify-center shrink-0 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6 text-gray-700">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm text-gray-900 font-medium line-clamp-1">{{ item.text }}</span>
                        <span class="text-xs text-gray-200">{{ item.date }}</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#2d82b5] to-transparent">
        <button
            class="w-full py-3 bg-[#1da1f2] text-white rounded-xl font-semibold shadow-lg hover:bg-[#1a91da] transition-colors">
            Guardar
        </button>
    </footer>
</div>
