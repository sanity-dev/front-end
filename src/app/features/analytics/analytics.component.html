<div
    class="min-h-screen bg-gradient-to-b from-[#6eb5e8] via-[#4a9dd9] to-[#2d82b5] flex flex-col font-sans text-white pb-20">
    <!-- Header -->
    <header class="flex items-center px-4 sm:px-6 py-4 bg-[#6eb5e8]">
        <button class="p-2 rounded-full hover:bg-white/20 transition-colors mr-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </button>
        <h1 class="text-base sm:text-lg md:text-xl font-semibold">Análisis de Emociones</h1>
    </header>

    <!-- Filters -->
    <div class="px-4 sm:px-6 py-4">
        <h3 class="text-sm font-medium mb-3">Filtros</h3>
        <div class="flex gap-2 sm:gap-3">
            <button *ngFor="let filter of filters" (click)="selectFilter(filter)"
                [class.bg-white]="selectedFilter === filter" [class.text-[#2d82b5]]="selectedFilter === filter"
                [class.bg-white/20]="selectedFilter !== filter"
                class="px-4 sm:px-5 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm font-medium transition-all hover:bg-white/30">
                {{ filter }}
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 px-4 sm:px-6 space-y-4 sm:space-y-5 max-w-4xl mx-auto w-full">
        <!-- Tendencia Emocional Card -->
        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-4 sm:p-5 border border-white/20 shadow-lg">
            <div class="mb-4">
                <h2 class="text-sm sm:text-base font-semibold text-white/90">Tendencia Emocional</h2>
                <div class="flex items-baseline gap-2 mt-1">
                    <span class="text-2xl sm:text-3xl font-bold">+12%</span>
                    <span class="text-xs sm:text-sm text-white/70">Últimos 30 días <span
                            class="text-green-300">-12%</span></span>
                </div>
            </div>
            <div class="h-40 sm:h-48">
                <canvas #trendChart></canvas>
            </div>
        </div>

        <!-- Frecuencia de Emociones Card -->
        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-4 sm:p-5 border border-white/20 shadow-lg">
            <div class="mb-4">
                <h2 class="text-sm sm:text-base font-semibold text-white/90">Frecuencia de Emociones</h2>
                <div class="flex items-baseline gap-2 mt-1">
                    <span class="text-2xl sm:text-3xl font-bold">+8%</span>
                    <span class="text-xs sm:text-sm text-white/70">Últimos 30 días <span
                            class="text-red-300">-8%</span></span>
                </div>
            </div>
            <div class="h-48 sm:h-56">
                <canvas #frequencyChart></canvas>
            </div>
        </div>

        <!-- Intensidad Emocional Card -->
        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-4 sm:p-5 border border-white/20 shadow-lg">
            <div class="mb-4">
                <h2 class="text-sm sm:text-base font-semibold text-white/90">Intensidad Emocional</h2>
                <div class="flex items-baseline gap-2 mt-1">
                    <span class="text-2xl sm:text-3xl font-bold">+5%</span>
                    <span class="text-xs sm:text-sm text-white/70">Últimos 30 días <span
                            class="text-green-300">-5%</span></span>
                </div>
            </div>
            <div class="h-40 sm:h-48">
                <canvas #intensityChart></canvas>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#2d3e50] border-t border-white/10 shadow-lg">
        <div class="flex justify-around items-center h-16 sm:h-18 max-w-4xl mx-auto px-2">
            <button
                class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-white/50 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                <span class="text-[9px] sm:text-[10px] font-medium">Home</span>
            </button>

            <button class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"
                    class="w-5 h-5 sm:w-6 sm:h-6">
                    <path
                        d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.214 8.214 0 0 1 18 18.75c.966 0 1.89.166 2.75.47a.75.75 0 0 0 1-.708V4.262a.75.75 0 0 0-.5-.707A9.735 9.735 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
                </svg>
                <span class="text-[9px] sm:text-[10px] font-medium">Diario</span>
            </button>

            <button
                class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-white/50 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
                </svg>
                <span class="text-[9px] sm:text-[10px] font-medium">Euforia</span>
            </button>

            <button
                class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-white/50 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <span class="text-[9px] sm:text-[10px] font-medium">Servicios</span>
            </button>

            <button
                class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-white/50 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                <span class="text-[9px] sm:text-[10px] font-medium">Perfil</span>
            </button>
        </div>
    </nav>
</div>
